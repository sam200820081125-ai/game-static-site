<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Rush Demo</title><style>body{margin:0;overflow:hidden;background:#08090c}canvas{display:block;width:100vw;height:100vh}</style><canvas id="c"></canvas><script>const c=document.querySelector('#c'),x=c.getContext('2d');function size(){c.width=innerWidth;c.height=innerHeight}addEventListener('resize',size);size();let t=0;function draw(){x.fillStyle='#08090c';x.fillRect(0,0,c.width,c.height);const cx=c.width/2,cy=c.height/2;for(let i=0;i<5;i++){x.strokeStyle=`rgba(255,160,40,${.12+i*.12})`;x.lineWidth=2;x.beginPath();x.arc(cx,cy,55+i*38,0,Math.PI*2);x.stroke()}const r=125;x.fillStyle='#fff';x.beginPath();x.arc(cx+Math.cos(t)*r,cy+Math.sin(t)*r,8,0,Math.PI*2);x.fill();t+=.035;requestAnimationFrame(draw)}draw()</script></html>
