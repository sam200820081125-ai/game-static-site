<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kingdom Grid Demo</title><style>body{margin:0;background:#0e1510;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.grid{display:grid;grid-template-columns:repeat(5,46px);gap:5px}.cell{aspect-ratio:1;display:grid;place-items:center;background:#24382a;border:1px solid #71915f;border-radius:6px}.cell:nth-child(2n){background:#314a36}.piece{font-size:27px}p{color:#b8c6b8;text-align:center}</style><main><div class="grid" id="g"></div><p>策略棋盤 HTML 原型示範</p></main><script>const g=document.querySelector('#g');for(let i=0;i<25;i++){const d=document.createElement('div');d.className='cell';if([2,7,12,18,23].includes(i))d.innerHTML='<span class="piece">♜</span>';g.appendChild(d)}</script></html>
